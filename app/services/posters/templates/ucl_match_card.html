<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;width:1080px;height:1350px;background:#070c2e;color:#fff;font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.poster{height:100%;padding:78px;background:radial-gradient(circle at 50% 0,{{ accent_color }},#111957 36%,#040617)}.league{font-size:34px;font-weight:700;letter-spacing:4px}.time{margin-top:18px;font-size:25px;color:#dde0ff}.teams{display:flex;align-items:center;justify-content:space-between;margin:150px 0 85px;font-size:62px;font-weight:800;text-align:center}.vs{font-size:32px;color:#c7cfff}.tag{font-size:25px;color:#dde0ff}.direction{margin-top:18px;font-size:47px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:74px}.card{min-height:130px;padding:24px;border:1px solid #d6daff55;background:#ffffff12;border-radius:18px}.label{font-size:21px;color:#d6daff}.value{margin-top:11px;font-size:32px;font-weight:700}.scores{margin-top:55px;padding:32px;border-bottom:9px solid {{ accent_color }};background:#ffffff12}.score-row{display:flex;justify-content:space-between;margin:17px 0;font-size:31px}.watermark{position:absolute;bottom:53px;left:78px;right:78px;text-align:center;color:#ffffff8a;font-size:21px;letter-spacing:2px}</style></head>
<body><main class="poster"><div class="league">{{ competition_name }}</div><div class="time">北京时间 {{ beijing_time }}</div><div class="teams"><span>{{ home_team }}</span><span class="vs">VS</span><span>{{ away_team }}</span></div><div class="tag">模型方向（模型推断）</div><div class="direction">{{ direction }}</div><section class="grid"><div class="card"><div class="label">总进球范围</div><div class="value">{{ goal_range }}</div></div><div class="card"><div class="label">双方进球倾向</div><div class="value">{{ btts_tendency }}</div></div><div class="card"><div class="label">风险等级</div><div class="value">{{ risk_level }}</div></div><div class="card"><div class="label">模型置信度</div><div class="value">{{ confidence }}</div></div></section><section class="scores"><div class="score-row"><span>主推比分</span><strong>{{ primary_score }}</strong></div><div class="score-row"><span>稳健比分</span><strong>{{ stable_score }}</strong></div><div class="score-row"><span>替代比分</span><strong>{{ alternative_score }}</strong></div></section><div class="watermark">{{ watermark }}</div></main></body></html>
