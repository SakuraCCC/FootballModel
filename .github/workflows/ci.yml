name: CI

on:
  push:
    branches: [main, "phase-1/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: football_model
          POSTGRES_USER: football_model
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U football_model -d football_model"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://football_model:test-password@localhost:5432/football_model
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install .[dev]
      - name: Install Chromium for poster rendering
        run: playwright install --with-deps chromium
      - name: Lint
        run: ruff check .
      - name: Run database migrations
        run: alembic upgrade head
      - name: Test
        run: pytest
      - name: Validate production compose
        run: docker compose -f docker-compose.prod.yml --env-file .env.production.example config
      - name: Build production images
        run: docker compose -f docker-compose.prod.yml --env-file .env.production.example build api worker
      - name: Poster rendering smoke test
        run: pytest tests/test_poster_renderer.py tests/test_poster_templates.py
      - name: Production smoke script syntax
        run: sh -n scripts/smoke_test.sh scripts/restore_postgres_test.sh
